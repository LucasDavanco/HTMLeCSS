<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de fomulario</title>
</head>
<body>
    <form action="cadastro.php" method="get" autocomplete="on">
        <fieldset>
            <legend>Dados Pessoais</legend>
            <p>
                <label for="inome">Nome</label>
                <input type="text" name="nome" id="inome" required minlength="8" placeholder="Digite aqui" autocomplete="name">
            </p>
            <p>
                <label for="imedia">Média</label>
                <input type="number" name="media" id="imedia" min="0" max="10" step="0.5" placeholder="0 a 10">
            </p>
            <p>
                <label for="imes">Periodo letivo</label>
                <input type="month" name="mes" id="imes">
            </p>
            <p>
                <label for="idata">Data da prova</label>
                <input type="date" name="Data" id="idata">
            </p>
            <p>
                <label for="ihora">Hora do curso</label>
                <input type="time" name="hora" id="ihora">
            </p>
        </fieldset>
    </form>
    
</body>
</html>
