<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TABELA</title>
    <style>
        table{
            text-align: center;
            width: 400px;
            border-collapse: collapse;
        }
        td{
            border: solid 1px black;
            padding: 4px;
        }
        tr.marcador{
            background-color: aqua;
        }
        td.dado {
            color: rgb(54, 165, 42);

            background-color: blueviolet;
        }
    </style>

</head>
<body>
    <h1>Minha Primeira TABELA</h1>
    <table>
        <tr>
            <td>A1</td>
            <td>A2</td>
            <td>A3</td>
        </tr>
        <tr class="marcador">
            <td>B1</td>
            <td>B2</td>
            <td>B3</td>
        </tr>
        <tr>
            <td class="dado">C1</td>
            <td>C2</td>
            <td>C3</td>
        </tr>
    </table>

</body>
</html>
